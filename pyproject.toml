[project]
name = "fastapi-htmx-tailwind"
version = "0.1.0"
authors = [
    { name = "Angelos Panagiotopoulos", email = "angelospanag@protonmail.com" },
]
description = "Experimenting rendering tabs using FastAPI and HTMX"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "faker>=40.44.0",
    "fastapi[standard]>=0.162.0",
    "jinja2>=3.1.6",
    "polars>=2.1.0",
]

[dependency-groups]
dev = ["httpx2>=2.16.0", "pytest>=9.2.0", "ruff>=0.17.4", "ty>=0.0.98"]
